<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budgets — EMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/main.css">
<style>
.budget-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
.budget-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px; transition:all 0.2s; position:relative; overflow:hidden; }
.budget-card:hover { box-shadow:var(--shadow-md); }
.budget-card--over { border-color:rgba(244,63,94,0.35); }
.budget-card--warning { border-color:rgba(245,158,11,0.35); }
.budget-card__top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
.budget-card__icon { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.budget-card__cat { font-size:16px; font-weight:600; }
.budget-card__period { font-size:12px; color:var(--text-muted); text-transform:capitalize; }
.budget-card__actions { display:flex; gap:4px; flex-shrink:0; }
.budget-card__amounts { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.budget-card__spent { font-size:22px; font-weight:700; font-family:var(--font-mono); letter-spacing:-0.5px; }
.budget-card__limit { font-size:13px; color:var(--text-muted); font-family:var(--font-mono); }
.budget-card__bar { height:8px; background:var(--ink-100); border-radius:var(--radius-full); overflow:hidden; margin-bottom:12px; }
.budget-card__fill { height:100%; border-radius:var(--radius-full); transition:width 0.6s ease; }
.budget-card__footer { display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--text-muted); }
.status-tag { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:var(--radius-full); font-size:11px; font-weight:600; }
.status-tag--safe { background:var(--success-bg); color:var(--success); }
.status-tag--warning { background:var(--warning-bg); color:var(--warning); }
.status-tag--over { background:var(--danger-bg); color:var(--danger); }
.overview-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
.ov-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; }
.ov-card__label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); }
.ov-card__val { font-size:22px; font-weight:700; font-family:var(--font-mono); letter-spacing:-0.5px; margin-top:4px; }
@media (max-width:768px) { .overview-row { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a href="dashboard.html" class="sidebar__brand">
      <div class="sidebar__brand-icon">💰</div>
      <div>
        <div class="sidebar__brand-name">EMS</div>
        <div class="sidebar__brand-sub">Finance Manager</div>
      </div>
    </a>
    <nav class="sidebar__nav">
      <div class="nav-section">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="expenses.html" class="nav-link"><i class="fa-solid fa-receipt"></i> Expenses</a>
        <a href="budget.html" class="nav-link active"><i class="fa-solid fa-chart-pie"></i> Budgets</a>
        <a href="savings.html" class="nav-link"><i class="fa-solid fa-piggy-bank"></i> Savings</a>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">Insights</div>
        <a href="analytics.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Analytics</a>
        <a href="reports.html" class="nav-link"><i class="fa-solid fa-file-arrow-down"></i> Reports</a>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">Account</div>
        <a href="settings.html" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
      </div>
    </nav>
    <div class="sidebar__footer">
      <div class="user-chip">
        <div class="user-avatar" id="sidebarAvatar">?</div>
        <div>
          <div class="user-name" id="sidebarName">Loading…</div>
          <div class="user-role">Personal Account</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__left"><div class="topbar__title">Budgets</div></div>
      <div class="topbar__right">
        <button class="btn btn--primary btn--sm" id="addBudgetBtn"><i class="fa-solid fa-plus"></i> New Budget</button>
        <button class="btn btn--ghost btn--sm" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </header>

    <div class="page">
      <div class="overview-row">
        <div class="ov-card">
          <div class="ov-card__label">Total Budget</div>
          <div class="ov-card__val" id="ovBudget">—</div>
        </div>
        <div class="ov-card">
          <div class="ov-card__label">Total Spent</div>
          <div class="ov-card__val" id="ovSpent" style="color:var(--danger)">—</div>
        </div>
        <div class="ov-card">
          <div class="ov-card__label">Remaining</div>
          <div class="ov-card__val" id="ovRemain" style="color:var(--success)">—</div>
        </div>
        <div class="ov-card">
          <div class="ov-card__label">Active Budgets</div>
          <div class="ov-card__val" id="ovCount">—</div>
        </div>
      </div>

      <div id="budgetGrid" class="budget-grid">
        <div class="empty-state" style="grid-column:1/-1;padding:60px 0"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Budget Modal -->
<div class="modal-overlay" id="budgetModal">
  <div class="modal" style="max-width:440px">
    <div class="modal__header">
      <h3 class="modal__title" id="budgetModalTitle">Create Budget</h3>
      <button class="modal__close" id="closeBudgetModal">✕</button>
    </div>
    <div class="modal__body">
      <input type="hidden" id="editBudgetId">
      <div class="form-group">
        <label class="form-label form-label--required">Category</label>
        <select class="form-control" id="bCategory"><option value="">Select…</option></select>
        <span class="form-error" id="bCategoryErr"></span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label class="form-label form-label--required" id="bAmountLabel">Amount</label>
          <input class="form-control" id="bAmount" type="number" min="1" step="0.01" placeholder="10000">
          <span class="form-error" id="bAmountErr"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Period</label>
          <select class="form-control" id="bPeriod">
            <option value="weekly">Weekly</option>
            <option value="monthly" selected>Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Alert Threshold: <strong id="threshLabel">80%</strong></label>
        <input type="range" id="bThreshold" min="50" max="100" value="80" step="5" style="width:100%;accent-color:var(--accent)">
        <span class="form-hint">You'll be warned when spending reaches this percentage</span>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-control" id="bNotes" rows="2" placeholder="Optional notes…" maxlength="500"></textarea>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" id="cancelBudgetModal">Cancel</button>
      <button class="btn btn--primary" id="saveBudgetBtn"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    </div>
  </div>
</div>

<script src="core.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { api, auth, Toast, Utils, Loader, CategoryLoader } = window.AppCore;
  const ok = await window.requireAuth();
  if (!ok) return;

  const u = auth.user;
  if (u) {
    document.getElementById('sidebarName').textContent = u.name || u.username;
    document.getElementById('sidebarAvatar').textContent = (u.first_name?.[0] || u.username?.[0] || '?').toUpperCase();
  }
  document.getElementById('bAmountLabel').textContent = `Amount (${Utils.getCurrencySymbol()})`;

  let budgets = [];

  async function loadBudgets() {
    try {
      budgets = await api.get('/budgets/analysis/', false);
      if (!Array.isArray(budgets)) budgets = [];
      renderOverview();
      renderCards();
    } catch (e) {
      Toast.error('Failed to load budgets: ' + e.message);
      document.getElementById('budgetGrid').innerHTML =
        `<div class="empty-state" style="grid-column:1/-1"><i class="fa-solid fa-circle-exclamation"></i><div class="empty-state__title">Failed to load</div></div>`;
    }
  }

  function renderOverview() {
    const totalB = budgets.reduce((s, b) => s + b.budget_amount, 0);
    const totalS = budgets.reduce((s, b) => s + b.spent_amount, 0);
    const remain = Math.max(0, totalB - totalS);
    document.getElementById('ovBudget').textContent = Utils.formatCurrency(totalB);
    document.getElementById('ovSpent').textContent = Utils.formatCurrency(totalS);
    document.getElementById('ovRemain').textContent = Utils.formatCurrency(remain);
    document.getElementById('ovCount').textContent = budgets.length;
  }

  function renderCards() {
    const grid = document.getElementById('budgetGrid');
    if (!budgets.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;padding:60px 0">
        <i class="fa-solid fa-chart-pie" style="font-size:48px"></i>
        <div class="empty-state__title">No budgets yet</div>
        <div class="empty-state__sub">Set spending limits by category to stay on track</div>
      </div>`;
      return;
    }
    grid.innerHTML = budgets.map(b => {
      const pct = Math.min(b.percentage_used, 100);
      const isOver = b.status === 'over';
      const isWarn = b.status === 'warning';
      const barColor = isOver ? '#f43f5e' : isWarn ? '#f59e0b' : '#10b981';
      const catColor = b.category_color || '#6366f1';
      const statusTag = isOver
        ? `<span class="status-tag status-tag--over"><i class="fa-solid fa-triangle-exclamation"></i> Over Budget</span>`
        : isWarn
        ? `<span class="status-tag status-tag--warning"><i class="fa-solid fa-bell"></i> Near Limit</span>`
        : `<span class="status-tag status-tag--safe"><i class="fa-solid fa-check"></i> On Track</span>`;
      const remain = Math.max(0, b.budget_amount - b.spent_amount);

      return `<div class="budget-card ${isOver ? 'budget-card--over' : isWarn ? 'budget-card--warning' : ''}">
        <div class="budget-card__top">
          <div style="display:flex;align-items:center;gap:12px">
            <div class="budget-card__icon" style="background:${catColor}18;color:${catColor}">
              <i class="fa-solid fa-${Utils.safeIcon(b.category_icon)}"></i>
            </div>
            <div>
              <div class="budget-card__cat">${Utils.escapeHtml(b.category)}</div>
              <div class="budget-card__period">${b.period} budget</div>
            </div>
          </div>
          <div class="budget-card__actions">
            <button class="btn btn--ghost btn--icon btn--sm edit-budget-btn" data-id="${b.id}" title="Edit"><i class="fa-solid fa-pen" style="font-size:12px"></i></button>
            <button class="btn btn--ghost btn--icon btn--sm del-budget-btn" data-id="${b.id}" title="Delete"><i class="fa-solid fa-trash-can" style="font-size:12px;color:var(--danger)"></i></button>
          </div>
        </div>
        <div class="budget-card__amounts">
          <span class="budget-card__spent" style="color:${barColor}">${Utils.formatCurrency(b.spent_amount)}</span>
          <span class="budget-card__limit">/ ${Utils.formatCurrency(b.budget_amount)}</span>
        </div>
        <div class="budget-card__bar"><div class="budget-card__fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="budget-card__footer">
          ${statusTag}
          <span>${isOver ? `Over by ${Utils.formatCurrency(b.spent_amount - b.budget_amount)}` : `${Utils.formatCurrency(remain)} left`}</span>
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('.edit-budget-btn').forEach(btn => btn.addEventListener('click', () => openEdit(parseInt(btn.dataset.id, 10))));
    document.querySelectorAll('.del-budget-btn').forEach(btn => btn.addEventListener('click', () => deleteBudget(parseInt(btn.dataset.id, 10))));
  }

  const modal = document.getElementById('budgetModal');
  function closeModal() { modal.classList.remove('open'); }
  document.getElementById('closeBudgetModal').addEventListener('click', closeModal);
  document.getElementById('cancelBudgetModal').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  document.getElementById('bThreshold').addEventListener('input', e => {
    document.getElementById('threshLabel').textContent = e.target.value + '%';
  });

  function openAdd() {
    document.getElementById('editBudgetId').value = '';
    document.getElementById('budgetModalTitle').textContent = 'Create Budget';
    document.getElementById('bCategory').value = '';
    document.getElementById('bCategory').disabled = false;
    document.getElementById('bAmount').value = '';
    document.getElementById('bPeriod').value = 'monthly';
    document.getElementById('bPeriod').disabled = false;
    document.getElementById('bThreshold').value = 80;
    document.getElementById('threshLabel').textContent = '80%';
    document.getElementById('bNotes').value = '';
    ['bCategoryErr', 'bAmountErr'].forEach(id => document.getElementById(id).textContent = '');
    modal.classList.add('open');
  }

  async function openEdit(id) {
    try {
      const b = await api.get(`/budgets/${id}/`, false);
      document.getElementById('editBudgetId').value = b.id;
      document.getElementById('budgetModalTitle').textContent = 'Edit Budget';
      document.getElementById('bCategory').value = b.category;
      document.getElementById('bCategory').disabled = true;
      document.getElementById('bAmount').value = parseFloat(b.amount);
      document.getElementById('bPeriod').value = b.period;
      document.getElementById('bPeriod').disabled = true;
      document.getElementById('bThreshold').value = b.alert_threshold;
      document.getElementById('threshLabel').textContent = b.alert_threshold + '%';
      document.getElementById('bNotes').value = b.notes || '';
      ['bCategoryErr', 'bAmountErr'].forEach(elId => document.getElementById(elId).textContent = '');
      modal.classList.add('open');
    } catch (e) { Toast.error(e.message); }
  }

  document.getElementById('saveBudgetBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveBudgetBtn');
    const id = document.getElementById('editBudgetId').value;
    const cat = document.getElementById('bCategory').value;
    const amt = parseFloat(document.getElementById('bAmount').value);
    const period = document.getElementById('bPeriod').value;
    const thresh = parseInt(document.getElementById('bThreshold').value, 10);
    const notes = document.getElementById('bNotes').value.trim();

    let valid = true;
    const setErr = (elId, msg) => { document.getElementById(elId).textContent = msg; if (msg) valid = false; };
    if (!id) setErr('bCategoryErr', cat ? '' : 'Category is required.');
    setErr('bAmountErr', amt > 0 ? '' : 'Valid amount required.');
    if (!valid) return;

    Loader.showBtn(btn);
    try {
      if (id) {
        await api.patch(`/budgets/${id}/`, { amount: amt, alert_threshold: thresh, notes });
        Toast.success('Budget updated!');
      } else {
        await api.post('/budgets/', { category: parseInt(cat, 10), amount: amt, period, alert_threshold: thresh, notes, is_active: true });
        Toast.success('Budget created!');
      }
      closeModal();
      loadBudgets();
    } catch (e) { Toast.error(e.message); }
    finally { Loader.showBtn(btn, false); }
  });

  async function deleteBudget(id) {
    if (!confirm('Delete this budget?')) return;
    try {
      await api.delete(`/budgets/${id}/`);
      Toast.success('Budget deleted.');
      loadBudgets();
    } catch (e) { Toast.error(e.message); }
  }

  document.getElementById('addBudgetBtn').addEventListener('click', openAdd);
  document.getElementById('logoutBtn').addEventListener('click', () => auth.logout());

  await CategoryLoader.populateSelect(document.getElementById('bCategory'), 'Select category…');
  loadBudgets();
});
</script>
</body>
</html>
