<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            margin: 20px;
        }
        
        .login-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .login-left i {
            font-size: 80px;
            margin-bottom: 30px;
        }
        
        .login-right {
            padding: 60px 40px;
        }
        
        .form-label {
            color: #374151;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-control {
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            padding: 12px 16px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: transform 0.3s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .input-icon {
            position: relative;
        }
        
        .input-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
        }
        
        .input-icon .form-control {
            padding-left: 45px;
        }
        
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9CA3AF;
        }
        
        .alert {
            border-radius: 8px;
        }
        
        .loading-spinner {
            display: none;
        }
        
        .loading-spinner.show {
            display: inline-block;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="text-center">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
            <p class="mt-3 text-muted">Loading...</p>
        </div>
    </div>

    <div class="login-container">
        <div class="row g-0">
            <!-- Left Side - Branding -->
            <div class="col-lg-5 login-left">
                <div>
                    <i class="fas fa-wallet"></i>
                    <h2>Welcome Back!</h2>
                    <p class="mb-0">Login to manage your expenses smartly with AI-powered predictions</p>
                </div>
            </div>
            
            <!-- Right Side - Form -->
            <div class="col-lg-7 login-right">
                <div class="mb-5">
                    <h3>Login to Your Account</h3>
                    <p class="text-muted">Enter your credentials to access your dashboard</p>
                </div>
                
                <!-- Alert Messages -->
                <div id="alertContainer"></div>
                
                <!-- Login Form -->
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" class="form-control" id="username" required placeholder="Enter username" autofocus autocomplete="username">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-control" id="password" required placeholder="Enter password" autocomplete="current-password">
                            <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                        </div>
                    </div>
                    
                    <div class="mb-4 d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="text-decoration-none">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login w-100 mb-4" id="loginBtn">
                        <span id="btnText">Login</span>
                        <span class="spinner-border spinner-border-sm loading-spinner ms-2" id="loadingSpinner"></span>
                    </button>
                    
                    <div class="text-center">
                        <p class="mb-0">Don't have an account? <a href="register.html" class="text-decoration-none fw-bold">Register here</a></p>
                    </div>
                    
                    <div class="text-center mt-3">
                        <small class="text-muted">Or go back to <a href="index.html" class="text-decoration-none">Home Page</a></small>
                    </div>
                </form>
                
                <!-- Demo Credentials -->
                <div class="mt-4 p-3 bg-light rounded">
                    <small class="text-muted">
                        <strong>Demo Credentials:</strong><br>
                        Username: admin<br>
                        Password: admin123
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="core.js"></script>
    <script>
(function initLoginPage() {
    let attempts = 0;
    const maxAttempts = 50;
    
    function checkAndInit() {
        attempts++;
        
        if (window.AppCore && window.AppCore.auth) {
            console.log('✓ AppCore detected, initializing login page...');
            hideLoadingOverlay();
            initializePage();
            return;
        }
        
        if (attempts < maxAttempts) {
            setTimeout(checkAndInit, 100);
        } else {
            console.error('AppCore failed to load');
            hideLoadingOverlay();
            showError();
        }
    }
    
    function hideLoadingOverlay() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) {
            overlay.style.display = 'none';
        }
    }
    
    function showError() {
        document.getElementById('alertContainer').innerHTML = `
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-triangle"></i>
                <strong>Error:</strong> System failed to load. Please refresh the page.
            </div>
        `;
        document.getElementById('loginBtn').disabled = true;
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkAndInit);
    } else {
        checkAndInit();
    }
})();

function initializePage() {
    const { auth } = window.AppCore;
    
    // Check if already logged in
    if (auth.isAuthenticated()) {
        document.getElementById('alertContainer').innerHTML = `
            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i>
                You're already logged in. <a href="dashboard.html" class="alert-link">Go to Dashboard</a>
            </div>
        `;
    }
    
    // Password toggle
    document.getElementById('togglePassword').addEventListener('click', function() {
        const password = document.getElementById('password');
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    // Login Form Handler
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
}

async function handleLogin(e) {
    e.preventDefault();

    if (!window.AppCore) {
        alert('System is loading. Please try again in a moment.');
        return;
    }

    const { auth } = window.AppCore;
    const alertContainer = document.getElementById('alertContainer');
    alertContainer.innerHTML = '';

    const btnText = document.getElementById('btnText');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const loginBtn = document.getElementById('loginBtn');

    // Show loading
    loginBtn.disabled = true;
    btnText.textContent = 'Logging in...';
    loadingSpinner.classList.add('show');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const rememberMe = document.getElementById('rememberMe').checked;

    try {
        const result = await auth.login(username, password, rememberMe);

        if (result.success) {
            alertContainer.innerHTML = `
                <div class="alert alert-success" role="alert">
                    <i class="fas fa-check-circle me-2"></i>Login successful! Redirecting...
                </div>
            `;
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        } else {
            alertContainer.innerHTML = `
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>${result.error || 'Login failed. Please check your credentials.'}
                </div>
            `;
        }
    } catch (error) {
        console.error('Login error:', error);
        alertContainer.innerHTML = `
            <div class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>Network error. Please make sure the backend server is running.
            </div>
        `;
    } finally {
        loginBtn.disabled = false;
        btnText.textContent = 'Login';
        loadingSpinner.classList.remove('show');
    }
}
    </script>
</body>
</html>
