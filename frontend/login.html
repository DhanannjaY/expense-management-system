<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — EMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  --accent: #7c3aed; --accent-light: #ede9fe;
  --text-primary: #14141e; --text-secondary: #5c5c7a; --text-muted: #9ca3af;
  --border: rgba(0,0,0,0.08); --bg: #f4f4f8; --danger: #f43f5e;
  --font: 'DM Sans', system-ui, sans-serif; --radius: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text-primary);
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  display: grid; grid-template-columns: 1fr 1.1fr;
  max-width: 860px; width: 100%; background: #fff;
  border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.12);
  overflow: hidden; border: 1px solid var(--border);
}
.left {
  background: linear-gradient(145deg, #1e1133 0%, #3b1a6e 50%, #6d28d9 100%);
  padding: 48px 40px; display: flex; flex-direction: column; justify-content: space-between;
  position: relative; overflow: hidden;
}
.left::before {
  content: ''; position: absolute; bottom: -80px; right: -80px;
  width: 260px; height: 260px; border-radius: 50%;
  background: rgba(255,255,255,0.05); pointer-events: none;
}
.left-logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 40px; height: 40px; background: rgba(255,255,255,0.15);
  border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.logo-text { color: #fff; font-size: 18px; font-weight: 600; }
.left-hero h2 { font-size: 26px; font-weight: 600; color: #fff; line-height: 1.3; letter-spacing: -0.4px; margin-bottom: 12px; }
.left-hero p { font-size: 14px; color: rgba(255,255,255,0.68); line-height: 1.6; }
.left-footer { font-size: 11px; color: rgba(255,255,255,0.35); }
.right { padding: 48px 40px; display: flex; flex-direction: column; justify-content: center; }
.right-header { margin-bottom: 26px; }
.right-header h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 4px; }
.right-header p { font-size: 14px; color: var(--text-secondary); }
.form-stack { display: flex; flex-direction: column; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
.input-wrap { position: relative; }
.input-wrap input {
  width: 100%; padding: 11px 14px 11px 40px;
  background: #f8f8fc; border: 1.5px solid rgba(0,0,0,0.1);
  border-radius: var(--radius); font-size: 14px; font-family: var(--font);
  color: var(--text-primary); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
}
.input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); background: #fff; }
.input-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 15px; pointer-events: none; }
.eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; }
.btn-submit {
  width: 100%; padding: 12px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600;
  font-family: var(--font); cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-submit:hover:not(:disabled) { background: #6d28d9; box-shadow: 0 4px 14px rgba(124,58,237,0.4); transform: translateY(-1px); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.spinner-sm {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.alert { padding: 11px 14px; border-radius: var(--radius); font-size: 13px; display: none; align-items: center; gap: 8px; margin-bottom: 14px; }
.alert.show { display: flex; }
.alert--error { background: rgba(244,63,94,0.08); color: #be123c; border: 1px solid rgba(244,63,94,0.2); }
.register-link { text-align: center; font-size: 14px; color: var(--text-secondary); margin-top: 6px; }
.register-link a { color: var(--accent); font-weight: 500; text-decoration: none; }
@media (max-width: 640px) {
  .wrap { grid-template-columns: 1fr; }
  .left { display: none; }
  .right { padding: 34px 24px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="left-logo">
      <div class="logo-icon">💰</div>
      <div class="logo-text">EMS</div>
    </div>
    <div class="left-hero">
      <h2>Welcome back to<br>smarter finance.</h2>
      <p>Track daily expenses, stay within category budgets, and forecast next month's spending with ML insights.</p>
    </div>
    <div class="left-footer">© 2026 EMS · Finance Manager</div>
  </div>

  <div class="right">
    <div class="right-header">
      <h2>Sign in</h2>
      <p>Enter your username or email to continue.</p>
    </div>

    <div class="alert alert--error" id="alertError"><span>⚠</span><span id="alertErrMsg"></span></div>

    <form class="form-stack" id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username or Email</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" id="username" placeholder="e.g. alice" autocomplete="username" autofocus required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="eye-btn" id="eyePw" aria-label="Toggle password">👁</button>
        </div>
      </div>

      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);cursor:pointer">
        <input type="checkbox" id="remember" style="accent-color:var(--accent)">
        Keep me signed in on this device
      </label>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnLabel">Sign In</span>
      </button>

      <div class="register-link">Don't have an account? <a href="register.html">Create one</a></div>
    </form>
  </div>
</div>

<script src="core.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { auth } = window.AppCore;
  if (auth.isAuthenticated() && await auth.verify()) {
    window.location.href = 'dashboard.html';
    return;
  }

  document.getElementById('eyePw').addEventListener('click', () => {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById('alertError');
    alertEl.classList.remove('show');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    if (!username || !password) {
      document.getElementById('alertErrMsg').textContent = 'Username and password are required.';
      alertEl.classList.add('show');
      return;
    }

    const btn = document.getElementById('submitBtn');
    const lbl = document.getElementById('btnLabel');
    btn.disabled = true;
    lbl.innerHTML = '<span class="spinner-sm"></span> Signing in…';

    const res = await auth.login(username, password, remember);
    if (res.success) {
      window.location.href = 'dashboard.html';
    } else {
      document.getElementById('alertErrMsg').textContent = res.error;
      alertEl.classList.add('show');
      btn.disabled = false;
      lbl.textContent = 'Sign In';
    }
  });
});
</script>
</body>
</html>
